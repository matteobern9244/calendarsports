name: Guard Main Source

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: guard-main-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard-main-source:
    name: guard-main-source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce develop as source branch for main
        # Il nome del branch arriva da chi apre la PR: interpolarlo dentro lo
        # script con `${{ }}` lo farebbe sostituire nel testo prima che la
        # shell lo legga, e un branch chiamato ad arte eseguirebbe comandi
        # arbitrari nel runner. Passato come variabile d'ambiente, resta un
        # dato.
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" = "develop" ]; then
            echo "Source branch is develop. Guard passed."
            exit 0
          fi

          echo "::error title=Invalid source branch::Only pull requests from develop to main are allowed."
          echo "Current source branch: $HEAD_REF"
          exit 1
