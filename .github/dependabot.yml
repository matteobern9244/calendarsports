version: 2
# Gli aggiornamenti npm sono passati a Renovate (renovate.json): raggruppa i
# minori in una PR sola, manda i major dalla dependency dashboard e sa tenere
# ferma la versione di TypeScript. Qui resta solo l'ecosistema delle Actions.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:30"
      timezone: "Europe/Rome"
    target-branch: "develop"
    open-pull-requests-limit: 2
    assignees:
      - "matteobern9244"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"